name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements-dev.txt
      - run: make lint
      - run: make test-cov
      - run: make test-js
      - run: make test-ops
      - run: pip-audit -r requirements.txt
      - name: Build and import the production image
        run: |
          docker build --tag openshare-ci .
          docker run --rm \
            --env SESSION_SECRET=ci-session-secret-that-is-long-enough \
            --env OIDC_CLIENT_ID=ci-client \
            --env OIDC_CLIENT_SECRET=ci-secret \
            --env OIDC_ISSUER=https://auth.example.test/application/o/openshare/ \
            --entrypoint python openshare-ci \
            -c 'import main; print(main.APP_VERSION)'
