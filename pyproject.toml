[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
  "unit: pure or narrowly isolated tests",
  "integration: in-process ASGI and temporary SQLite/storage tests",
]

[tool.coverage.run]
branch = true
source = ["main", "auth", "db"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
