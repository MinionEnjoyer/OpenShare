<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{% block title %}OpenShare{% endblock %}</title>
<script>(function(){var p=localStorage.getItem('openshare-theme')||'system';var d=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.dataset.themePreference=p;try{var s=JSON.parse(localStorage.getItem('openshare-preferences')||'{}');document.documentElement.dataset.folderDensity=s.folderDensity==='compact'?'compact':'comfortable';document.documentElement.dataset.motion=s.motion==='reduced'?'reduced':'system'}catch(e){document.documentElement.dataset.folderDensity='comfortable';document.documentElement.dataset.motion='system'}})()</script>
{% block meta %}{% endblock %}
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
<script defer src="/static/loading.js"></script>
</head>
<body>
<nav class="app-nav">
  <a href="/" class="brand"><img src="/static/logo.png" alt="" width="24" height="24" style="vertical-align:-6px;margin-right:8px">OpenShare</a>
  <div class="spacer"></div>
  {% if user %}
    <span class="user">{{ user.username }}</span>
    <a href="/auth/logout" class="btn">Sign out</a>
  {% endif %}
</nav>
{% if user %}
<section class="subheader">
  <form action="/search" method="get" class="search-bar" data-loading="Searching…">
    <input type="search" name="q" placeholder="Search your library…" value="{{ q|default('', true) }}" autocomplete="off">
  </form>
  {% if user_storage %}
  <p class="storage-info muted">{{ user_storage }} used</p>
  {% endif %}
</section>
{% endif %}
<main>{% block content %}{% endblock %}</main>
<footer class="app-version" aria-label="OpenShare version {{ app_version }}">OpenShare v{{ app_version }}</footer>
<div id="page-busy" class="page-busy" role="status" aria-live="polite" hidden>
  <span class="oc-spinner oc-spinner--sm" aria-hidden="true"></span>
  <span id="page-busy-text">Working…</span>
</div>
<div id="page-error" class="page-error" role="alert" aria-live="assertive" hidden>
  <span id="page-error-text"></span>
  <button type="button" aria-label="Dismiss error" onclick="OpenShareLoading.clearError()">×</button>
</div>
</body>
</html>
