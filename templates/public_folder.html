{% extends "base.html" %}
{% block title %}{{ folder.name }} — OpenShare{% endblock %}
{% block meta %}
<meta property="og:title" content="{{ folder.name }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ share_url }}">
{% if preview_image_url %}<meta property="og:image" content="{{ preview_image_url }}">{% endif %}
{% endblock %}
{% block content %}
<div id="public-folder-root"></div>
<script id="public-folder-data" type="application/json">{{ public_data|tojson }}</script>
<noscript><p class="page-error">This shared folder requires JavaScript.</p></noscript>
{% endblock %}
